[project]
name = "rootguard"
version = "0.0.0"
description = "Provenance-based defense layer for OS-level AI agents (research)"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "sqlalchemy",
    "alembic",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
rootguard = "rootguard.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
